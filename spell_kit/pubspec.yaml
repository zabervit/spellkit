name: spell_kit
description: "A spelling dictation trainer for kids aged 6-10."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # TTS
  flutter_tts: ^4.2.0

  # Sound effects
  audioplayers: ^6.4.0

  # Animations
  lottie: ^3.3.1

  # Sharing
  screenshot: ^3.0.0
  share_plus: ^10.1.4

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
